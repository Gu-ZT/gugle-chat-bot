<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <title>{{title}}</title>
    <link rel="stylesheet" href="./style/video.css">
</head>
<body>
<div class="container">
    <img class="cover" alt="cover" src="{{cover}}"/>
    <div class="up">
        <img class="up-avatar" alt="avatar" src="{{avatar}}"/>
        <div class="up-name">
            {{name}}
        </div>
        <div class="up-date">{{date}}</div>
        <div class="up-duration">{{duration}}</div>
    </div>
    <div class="title">
        {{title}}
    </div>
    <div class="stats">
        <div class="view">
            <svg width="14" height="14" viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path d="M24 36C35.0457 36 44 24 44 24C44 24 35.0457 12 24 12C12.9543 12 4 24 4 24C4 24 12.9543 36 24 36Z"
                      fill="currentColor" stroke="currentColor" stroke-width="4" stroke-linejoin="round"/>
                <path d="M24 29C26.7614 29 29 26.7614 29 24C29 21.2386 26.7614 19 24 19C21.2386 19 19 21.2386 19 24C19 26.7614 21.2386 29 24 29Z"
                      fill="#FFF" stroke="#FFF" stroke-width="4" stroke-linejoin="round"/>
            </svg>
            {{view}}
        </div>
        <div class="like">
            <svg width="14" height="14" viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path d="M4.18898 22.1733C4.08737 21.0047 5.00852 20 6.18146 20H10C11.1046 20 12 20.8954 12 22V41C12 42.1046 11.1046 43 10 43H7.83363C6.79622 43 5.93102 42.2068 5.84115 41.1733L4.18898 22.1733Z"
                      fill="currentColor" stroke="currentColor" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
                <path d="M18 21.3745C18 20.5388 18.5194 19.7908 19.2753 19.4345C20.9238 18.6574 23.7329 17.0938 25 14.9805C26.6331 12.2569 26.9411 7.33595 26.9912 6.20878C26.9982 6.05099 26.9937 5.89301 27.0154 5.73656C27.2861 3.78446 31.0543 6.06492 32.5 8.47612C33.2846 9.78471 33.3852 11.504 33.3027 12.8463C33.2144 14.2825 32.7933 15.6699 32.3802 17.0483L31.5 19.9845H42.3569C43.6832 19.9845 44.6421 21.2518 44.2816 22.5281L38.9113 41.5436C38.668 42.4051 37.8818 43 36.9866 43H20C18.8954 43 18 42.1046 18 41V21.3745Z"
                      fill="currentColor" stroke="currentColor" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
            {{like}}
        </div>
        <div class="reply">
            <svg width="14" height="14" viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path d="M44 6H4V36H13V41L23 36H44V6Z" fill="currentColor" stroke="currentColor" stroke-width="4"
                      stroke-linecap="round" stroke-linejoin="round"/>
                <path d="M14 19.5V22.5" stroke="#FFF" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
                <path d="M24 19.5V22.5" stroke="#FFF" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
                <path d="M34 19.5V22.5" stroke="#FFF" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
            {{reply}}
        </div>
    </div>
    <div class="description">
        {{description}}
    </div>
</div>
</body>
{{style sheet}}
</html>
