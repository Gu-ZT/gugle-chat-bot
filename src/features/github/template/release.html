<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <title>{{release title}}</title>
    <link rel="stylesheet" href="./style/release.css">
</head>

<body>
{{header extra}}
<div class="repository_header">
    <svg class="repository_mark" viewBox="0 0 16 16" aria-hidden="true"><path d="M8 0c4.42 0 8 3.58 8 8a8.013 8.013 0 0 1-5.45 7.59c-.4.08-.55-.17-.55-.38 0-.27.01-1.13.01-2.2 0-.75-.25-1.23-.54-1.48 1.78-.2 3.65-.88 3.65-3.95 0-.88-.31-1.59-.82-2.15.08-.2.36-1.02-.08-2.12 0 0-.67-.22-2.2.82-.64-.18-1.32-.27-2-.27-.68 0-1.36.09-2 .27-1.53-1.04-2.2-.82-2.2-.82-.44 1.1-.16 1.91-.08 2.12-.51.56-.82 1.27-.82 2.15 0 3.06 1.86 3.75 3.64 3.95-.23.2-.44.55-.51 1.07-.46.21-1.61.55-2.33-.66-.15-.24-.6-.83-1.23-.82-.67.01-.27.38-.01.53.34.19.73.9.82 1.13.16.45.68 1.31 2.69.94 0 .67.01 1.3.01 1.49 0 .21-.15.45-.55.38A7.995 7.995 0 0 1 0 8c0-4.42 3.58-8 8-8Z"/></svg>
    <span class="repository_owner">{{repository owner}}</span>
    <span class="repository_separator">/</span>
    <strong class="repository_name">{{repository name}}</strong>
    <span class="repository_chevron" aria-hidden="true"><svg viewBox="0 0 16 16"><path d="M4.22 6.22a.75.75 0 0 1 1.06 0L8 8.94l2.72-2.72a.75.75 0 1 1 1.06 1.06l-3.25 3.25a.75.75 0 0 1-1.06 0L4.22 7.28a.75.75 0 0 1 0-1.06Z"/></svg></span>
</div>
<div class="container">
    <div class="release_header">
        <div class="release_title_row">
            {{release badge}}
            <h1 class="release_title"><bdi>{{release title}}</bdi></h1>
        </div>
        <div class="release_tag_row">
            <svg class="release_tag_icon" viewBox="0 0 16 16" aria-hidden="true"><path d="M1 7.775V2.75C1 1.784 1.784 1 2.75 1h5.025c.464 0 .91.184 1.238.513l6.25 6.25a1.75 1.75 0 0 1 0 2.474l-5.026 5.026a1.75 1.75 0 0 1-2.474 0l-6.25-6.25A1.752 1.752 0 0 1 1 7.775Zm1.5 0c0 .066.026.13.073.177l6.25 6.25a.25.25 0 0 0 .354 0l5.025-5.025a.25.25 0 0 0 0-.354l-6.25-6.25a.25.25 0 0 0-.177-.073H2.75a.25.25 0 0 0-.25.25ZM6 5a1 1 0 1 1 0 2 1 1 0 0 1 0-2Z"/></svg>
            <span class="release_tag_name">{{release tag}}</span>
            <span class="release_tag_meta">· {{release commitish}}</span>
        </div>
        <div class="release_meta_row">
            <span class="release_author">{{release author}}</span>
            <span class="release_meta_text">released this {{release published at}}</span>
        </div>
    </div>
    <div class="header_body_splitter"></div>
    <div class="release_body">
        <div class="content_container">
            <div class="content_body">
                {{release body}}
            </div>
        </div>
        <div class="assets_section">
            <div class="assets_header">
                <h2 class="assets_title">Assets</h2>
                <span class="assets_count">{{release asset count}} assets</span>
            </div>
            <div class="assets_list">
                {{release assets}}
            </div>
        </div>
    </div>
</div>
</body>
</html>
